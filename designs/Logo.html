<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nirva logo</title>
<!-- Approved Nirva design, 1440 x 900. Reference only: fonts are bundled in the real browser. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#55534E}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 96px 120px; background: #F2F1EE; color: #1C1C1A; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 72px">
    <svg width="300" height="300" viewBox="0 0 100 100" role="img" aria-label="Nirva app icon"><rect width="100" height="100" rx="24" fill="#14181D"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#F2F1EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 168px; line-height: .9; font-weight: 300; letter-spacing: -.045em">Nirva</div>
      <p style="margin: 0; max-width: 520px; font-size: 18px; line-height: 1.5; color: #55534E">The mark is an N drawn in one stroke: two stems joined by a single arc.</p>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Icon in Glass colours"><rect width="100" height="100" rx="24" fill="#DDE5EC"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#18212B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 14px; color: #55534E">Glass</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Icon in Cockpit colours"><rect width="100" height="100" rx="24" fill="#0B0E11"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#F5B25C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 14px; color: #55534E">Cockpit</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Icon in Paper colours"><rect width="100" height="100" rx="24" fill="#F1E7BE"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#2A2826" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 14px; color: #55534E">Paper</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-end">
      <div style="display: flex; align-items: flex-end; gap: 20px">
        <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#14181D"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#F2F1EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#14181D"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#F2F1EE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#14181D"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#F2F1EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-size: 14px; color: #55534E">Dock, tab and favicon sizes</span>
    </div>
  </div>
</div>
</body>
</html>
