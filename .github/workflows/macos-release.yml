# Builds Nirva for macOS 12 (Monterey) and newer, for Apple Silicon and Intel Macs, and
# publishes both disk images as a GitHub Release, which appears on the repository page.
#
# Start it by hand: Actions tab -> "macOS release" -> "Run workflow" -> type a version (e.g. 0.1.0).
# Or push a tag:    git tag v0.1.0 && git push origin v0.1.0
#
# Uses only GitHub's free standard runners. The app is ad-hoc signed (free); without a paid
# Apple Developer ID, macOS asks people to confirm the first launch (see the release notes).
name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.1.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: apple-silicon, os: macos-15 }
          - { arch: intel, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Firefox at the base commit
        run: |
          base=$(cut -d' ' -f1 firefox-base.txt)
          git init -q firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox
          git -C firefox fetch -q --depth 1 origin "$base"
          git -C firefox checkout -q FETCH_HEAD

      - name: Apply Nirva changes
        run: |
          cp configs/mozconfig.release firefox/mozconfig
          # Runs on macOS 12 Monterey and every later version.
          echo 'ac_add_options --enable-macos-target=12.0' >> firefox/mozconfig
          python3 tools/nirva-patches import

      - name: Bootstrap
        working-directory: firefox
        run: ./mach --no-interactive bootstrap --application-choice browser

      - name: Build
        working-directory: firefox
        run: ./mach build

      - name: Package
        working-directory: firefox
        run: ./mach package

      - name: Sign (ad-hoc) and make the disk image
        working-directory: firefox
        run: |
          set -euo pipefail
          dmg=$(ls obj-nirva/dist/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          stage=$(mktemp -d)
          cp -R "$mnt/Nirva.app" "$stage/"
          hdiutil detach "$mnt" -quiet
          ./mach macos-sign -a "$stage/Nirva.app"
          codesign --verify --deep --strict "$stage/Nirva.app"
          ln -s /Applications "$stage/Applications"
          out="$GITHUB_WORKSPACE/Nirva-$VERSION-macOS-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Nirva" -srcfolder "$stage" -format UDZO -ov "$out"
          shasum -a 256 "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: nirva-macos-${{ matrix.arch }}
          path: Nirva-*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          cat > notes.md <<'EOF'
          ## Download for Mac (macOS 12 Monterey or newer)

          - **Apple Silicon** (M1, M2, M3, M4 and later): `Nirva-…-macOS-apple-silicon.dmg`
          - **Intel Macs**: `Nirva-…-macOS-intel.dmg`

          Not sure which? Apple menu → About This Mac → "Chip" (Apple) or "Processor" (Intel).

          ### Installing
          1. Open the .dmg and drag **Nirva** onto **Applications**.
          2. The first time, macOS says it cannot check the app. Open **System Settings → Privacy &
             Security**, scroll down and click **Open Anyway** next to Nirva (on macOS 12–14 you can
             instead right-click Nirva in Applications and choose **Open**).
          3. After that, Nirva opens normally.
          EOF
          gh release create "$tag" dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nirva $tag" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
