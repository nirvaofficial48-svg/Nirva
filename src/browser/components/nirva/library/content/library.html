<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="nirva-library-title"></title>
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/nirva/library.ftl" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/tokens.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/fonts.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/theme.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/library.css" />
    <script
      type="module"
      src="chrome://browser/content/nirva/library.mjs"
    ></script>
  </head>
  <body>
    <p
      id="private-notice"
      class="private-notice"
      hidden
      data-l10n-id="nirva-library-private-window"
    ></p>
    <main class="page">
      <header class="page-heading">
        <div class="heading-copy">
          <p class="eyebrow" data-l10n-id="nirva-library-eyebrow"></p>
          <h1 data-l10n-id="nirva-library-title"></h1>
          <p class="intro" data-l10n-id="nirva-library-intro"></p>
        </div>
        <button
          id="export-all"
          class="quiet-button"
          type="button"
          data-l10n-id="nirva-library-export-all"
        ></button>
      </header>

      <section class="privacy-note" aria-labelledby="privacy-heading">
        <h2
          id="privacy-heading"
          data-l10n-id="nirva-library-privacy-title"
        ></h2>
        <div>
          <p data-l10n-id="nirva-library-privacy-copy"></p>
          <p id="usage" class="usage"></p>
        </div>
      </section>

      <section class="library-section" aria-labelledby="pages-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-l10n-id="nirva-library-list-label"></p>
            <h2 id="pages-heading" data-l10n-id="nirva-library-list-title"></h2>
          </div>
          <p id="page-count" class="item-count"></p>
        </div>
        <div class="toolbar">
          <label class="field search-field">
            <span data-l10n-id="nirva-library-search-label"></span>
            <input
              id="search"
              type="search"
              maxlength="200"
              data-l10n-id="nirva-library-search"
            />
          </label>
          <label class="field tag-field">
            <span data-l10n-id="nirva-library-tag-filter-label"></span>
            <select id="tag-filter"></select>
          </label>
          <button
            id="delete-all"
            class="danger-button"
            type="button"
            data-l10n-id="nirva-library-delete-all"
          ></button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="empty-state" class="empty-state" hidden>
          <h3 data-l10n-id="nirva-library-empty-title"></h3>
          <p data-l10n-id="nirva-library-empty-copy"></p>
        </div>
        <p
          id="no-results"
          class="empty-state"
          hidden
          data-l10n-id="nirva-library-no-results"
        ></p>
        <ol id="pages" class="page-list" aria-labelledby="pages-heading"></ol>
      </section>
    </main>
    <template id="page-template">
      <li class="page-card">
        <h3 class="page-title"></h3>
        <p class="page-source"></p>
        <p class="page-copy-state"></p>
        <p class="page-copy-partial" hidden></p>
        <div class="page-actions">
          <button
            class="open-copy primary-button"
            type="button"
            data-l10n-id="nirva-library-open-copy"
          ></button>
          <button
            class="open-live quiet-button"
            type="button"
            data-l10n-id="nirva-library-open-live"
          ></button>
          <button
            class="export-copy quiet-button"
            type="button"
            data-l10n-id="nirva-library-export-copy"
          ></button>
          <button
            class="remove-copy quiet-button"
            type="button"
            data-l10n-id="nirva-library-remove-copy"
          ></button>
          <button
            class="delete-page danger-button"
            type="button"
            data-l10n-id="nirva-library-delete-page"
          ></button>
        </div>
        <label class="field">
          <span data-l10n-id="nirva-library-tags-label"></span>
          <input
            class="page-tags"
            maxlength="600"
            data-l10n-id="nirva-library-tags-input"
          />
        </label>
        <label class="field">
          <span data-l10n-id="nirva-library-page-note-label"></span>
          <textarea class="page-note" rows="2" maxlength="4000"></textarea>
        </label>
        <section class="highlights" hidden>
          <h4 class="highlights-heading"></h4>
          <ol class="highlight-list"></ol>
        </section>
      </li>
    </template>
    <template id="highlight-template">
      <li class="highlight">
        <blockquote class="highlight-quote"></blockquote>
        <div class="highlight-row">
          <label class="field">
            <span data-l10n-id="nirva-library-annotation-note-label"></span>
            <textarea
              class="highlight-note"
              rows="1"
              maxlength="4000"
            ></textarea>
          </label>
          <button
            class="remove-highlight quiet-button"
            type="button"
            data-l10n-id="nirva-library-remove-highlight"
          ></button>
        </div>
      </li>
    </template>
  </body>
</html>
