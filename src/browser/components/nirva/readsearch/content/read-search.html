<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="nirva-read-search-title"></title>
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/nirva/read-search.ftl" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/tokens.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/fonts.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/theme.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/read-search.css" />
    <script
      type="module"
      src="chrome://browser/content/nirva/read-search.mjs"
    ></script>
  </head>
  <body>
    <main class="page">
      <header class="page-heading">
        <div class="heading-copy">
          <p class="eyebrow" data-l10n-id="nirva-read-search-eyebrow"></p>
          <h1 data-l10n-id="nirva-read-search-title"></h1>
          <p class="intro" data-l10n-id="nirva-read-search-intro"></p>
        </div>
      </header>

      <section class="search-panel" aria-labelledby="search-heading">
        <div class="search-heading">
          <p class="eyebrow" data-l10n-id="nirva-read-search-find-label"></p>
          <h2 id="search-heading" data-l10n-id="nirva-read-search-find"></h2>
        </div>
        <form id="search-form" role="search">
          <label
            class="visually-hidden"
            for="query"
            data-l10n-id="nirva-read-search-query-label"
          ></label>
          <input
            id="query"
            type="search"
            autocomplete="off"
            spellcheck="false"
            data-l10n-id="nirva-read-search-query-placeholder"
            data-l10n-attrs="placeholder"
          />
        </form>
        <div id="filters" class="filters">
          <div
            class="filter-group"
            role="group"
            data-l10n-id="nirva-read-search-filter-time"
          >
            <button
              type="button"
              data-filter="time"
              data-value="any"
              aria-pressed="true"
              data-l10n-id="nirva-read-search-filter-any-time"
            ></button>
            <button
              type="button"
              data-filter="time"
              data-value="7"
              aria-pressed="false"
              data-l10n-id="nirva-read-search-filter-week"
            ></button>
            <button
              type="button"
              data-filter="time"
              data-value="30"
              aria-pressed="false"
              data-l10n-id="nirva-read-search-filter-month"
            ></button>
          </div>
          <div
            class="filter-group"
            role="group"
            data-l10n-id="nirva-read-search-filter-kind"
          >
            <button
              type="button"
              data-filter="kind"
              data-value="all"
              aria-pressed="true"
              data-l10n-id="nirva-read-search-filter-all"
            ></button>
            <button
              type="button"
              data-filter="kind"
              data-value="live"
              aria-pressed="false"
              data-l10n-id="nirva-read-search-filter-live"
            ></button>
            <button
              type="button"
              data-filter="kind"
              data-value="saved"
              aria-pressed="false"
              data-l10n-id="nirva-read-search-filter-saved"
            ></button>
          </div>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <ol
          id="results"
          class="result-list"
          aria-labelledby="search-heading"
        ></ol>
        <p
          id="empty-state"
          class="empty-state"
          hidden
          data-l10n-id="nirva-read-search-empty"
        ></p>
        <section id="recent" class="recent" aria-labelledby="recent-heading">
          <p
            id="recent-heading"
            class="eyebrow"
            data-l10n-id="nirva-read-search-recent"
          ></p>
          <ol id="recent-list" class="recent-list"></ol>
        </section>
      </section>

      <details id="manage" class="manage-index">
        <summary>
          <span data-l10n-id="nirva-read-search-manage"></span>
          <span id="manage-summary" class="manage-summary"></span>
        </summary>
        <div class="manage-actions">
          <button
            id="pause-toggle"
            class="quiet-button"
            type="button"
            data-l10n-id="nirva-read-search-pause"
          ></button>
          <button
            id="clear-all"
            class="quiet-button danger-button"
            type="button"
            data-l10n-id="nirva-read-search-clear-all"
          ></button>
        </div>
        <p class="privacy-note" data-l10n-id="nirva-read-search-privacy"></p>
        <section class="control-panel" aria-labelledby="controls-heading">
          <div class="section-heading">
            <div>
              <p
                class="eyebrow"
                data-l10n-id="nirva-read-search-controls-label"
              ></p>
              <h2
                id="controls-heading"
                data-l10n-id="nirva-read-search-controls"
              ></h2>
            </div>
            <p id="page-count" class="page-count"></p>
          </div>
          <div class="controls-grid">
            <label for="retention">
              <span data-l10n-id="nirva-read-search-retention"></span>
              <select id="retention">
                <option
                  value="7"
                  data-l10n-id="nirva-read-search-seven-days"
                ></option>
                <option
                  value="30"
                  data-l10n-id="nirva-read-search-thirty-days"
                ></option>
                <option
                  value="90"
                  data-l10n-id="nirva-read-search-ninety-days"
                ></option>
              </select>
            </label>
            <label for="delete-date">
              <span data-l10n-id="nirva-read-search-delete-before"></span>
              <input id="delete-date" type="date" />
            </label>
            <button
              id="delete-before"
              class="quiet-button danger-button"
              type="button"
              data-l10n-id="nirva-read-search-delete-date-action"
              disabled
            ></button>
            <form id="exclude-domain-form" class="domain-form">
              <label
                for="domain-input"
                data-l10n-id="nirva-read-search-domain-label"
              ></label>
              <div class="inline-control">
                <input
                  id="domain-input"
                  type="text"
                  inputmode="url"
                  autocomplete="off"
                  spellcheck="false"
                  data-l10n-id="nirva-read-search-domain-placeholder"
                  data-l10n-attrs="placeholder"
                />
                <button
                  class="quiet-button"
                  type="submit"
                  data-l10n-id="nirva-read-search-domain-add"
                ></button>
              </div>
            </form>
          </div>
        </section>

        <section class="management-grid" aria-labelledby="management-heading">
          <h2
            id="management-heading"
            class="visually-hidden"
            data-l10n-id="nirva-read-search-management-label"
          ></h2>
          <section class="list-panel" aria-labelledby="domains-heading">
            <div class="section-heading">
              <div>
                <p
                  class="eyebrow"
                  data-l10n-id="nirva-read-search-sites-label"
                ></p>
                <h2
                  id="domains-heading"
                  data-l10n-id="nirva-read-search-sites"
                ></h2>
              </div>
            </div>
            <ul id="domains" class="management-list"></ul>
            <p
              id="domains-empty"
              class="muted"
              hidden
              data-l10n-id="nirva-read-search-sites-empty"
            ></p>
            <h3 data-l10n-id="nirva-read-search-excluded-sites"></h3>
            <ul id="excluded-domains" class="management-list compact-list"></ul>
            <p
              id="excluded-domains-empty"
              class="muted"
              hidden
              data-l10n-id="nirva-read-search-excluded-sites-empty"
            ></p>
          </section>

          <section class="list-panel" aria-labelledby="pages-heading">
            <div class="section-heading">
              <div>
                <p
                  class="eyebrow"
                  data-l10n-id="nirva-read-search-pages-label"
                ></p>
                <h2
                  id="pages-heading"
                  data-l10n-id="nirva-read-search-pages"
                ></h2>
              </div>
            </div>
            <ul id="pages" class="management-list page-list"></ul>
            <p
              id="pages-empty"
              class="muted"
              hidden
              data-l10n-id="nirva-read-search-pages-empty"
            ></p>
            <h3 data-l10n-id="nirva-read-search-excluded-pages"></h3>
            <ul id="excluded-pages" class="management-list compact-list"></ul>
            <p
              id="excluded-pages-empty"
              class="muted"
              hidden
              data-l10n-id="nirva-read-search-excluded-pages-empty"
            ></p>
          </section>
        </section>
      </details>
    </main>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog" class="confirm-card">
        <p class="eyebrow" data-l10n-id="nirva-read-search-confirm-label"></p>
        <h2 id="confirm-title"></h2>
        <p id="confirm-copy"></p>
        <div class="confirm-actions">
          <button
            class="quiet-button"
            type="submit"
            value="cancel"
            data-l10n-id="nirva-read-search-cancel"
          ></button>
          <button
            id="confirm-action"
            class="primary-button"
            type="button"
          ></button>
        </div>
      </form>
    </dialog>
  </body>
</html>
