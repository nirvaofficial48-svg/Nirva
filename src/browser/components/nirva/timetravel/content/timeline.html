<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="nirva-time-travel-title"></title>
    <link rel="localization" href="browser/nirva/time-travel.ftl" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/tokens.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/fonts.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/theme.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/time-travel.css" />
    <script
      type="module"
      src="chrome://browser/content/nirva/timeline.mjs"
    ></script>
  </head>
  <body>
    <main class="page">
      <header class="page-heading">
        <div>
          <p class="eyebrow" data-l10n-id="nirva-time-travel-eyebrow"></p>
          <h1 data-l10n-id="nirva-time-travel-title"></h1>
          <p class="intro" data-l10n-id="nirva-time-travel-intro"></p>
        </div>
        <div class="heading-actions">
          <button
            id="save-now"
            class="quiet-button"
            type="button"
            data-l10n-id="nirva-time-travel-save-now"
          ></button>
        </div>
      </header>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="finder">
        <input
          id="find"
          type="search"
          autocomplete="off"
          data-l10n-id="nirva-time-travel-find"
        />
        <div
          id="day-strip"
          class="day-strip"
          role="group"
          data-l10n-id="nirva-time-travel-days"
        ></div>
      </div>

      <section class="timeline-grid" aria-labelledby="timeline-heading">
        <div class="timeline-column">
          <div class="section-heading">
            <div>
              <p
                class="eyebrow"
                data-l10n-id="nirva-time-travel-history-label"
              ></p>
              <h2
                id="timeline-heading"
                data-l10n-id="nirva-time-travel-history"
              ></h2>
            </div>
            <span id="list-count" class="list-count"></span>
          </div>
          <ol id="snapshot-list" class="snapshot-list"></ol>
          <p id="empty-state" hidden data-l10n-id="nirva-time-travel-empty"></p>
        </div>

        <section
          id="preview-panel"
          class="preview-panel"
          aria-labelledby="preview-heading"
        >
          <div class="section-heading">
            <div>
              <p
                class="eyebrow"
                data-l10n-id="nirva-time-travel-preview-label"
              ></p>
              <h2
                id="preview-heading"
                data-l10n-id="nirva-time-travel-preview"
              ></h2>
            </div>
            <div class="preview-actions">
              <button
                id="delete-snapshot"
                class="quiet-button"
                type="button"
                data-l10n-id="nirva-time-travel-delete"
                disabled
              ></button>
              <button
                id="restore-snapshot"
                class="primary-button"
                type="button"
                data-l10n-id="nirva-time-travel-restore"
                disabled
              ></button>
            </div>
          </div>
          <p id="preview-date" class="preview-date"></p>
          <div id="preview-counts" class="preview-counts"></div>
          <div id="preview-windows" class="preview-windows">
            <p
              class="preview-placeholder"
              data-l10n-id="nirva-time-travel-pick-snapshot"
            ></p>
          </div>
        </section>
      </section>

      <details id="memory-settings" class="memory-settings">
        <summary>
          <span
            id="settings-heading"
            data-l10n-id="nirva-time-travel-controls"
          ></span>
          <span id="settings-summary" class="settings-summary"></span>
        </summary>
        <section class="settings-row" aria-labelledby="settings-heading">
          <label for="retention">
            <span data-l10n-id="nirva-time-travel-retention"></span>
            <select id="retention">
              <option
                value="7"
                data-l10n-id="nirva-time-travel-seven-days"
              ></option>
              <option
                value="14"
                data-l10n-id="nirva-time-travel-fourteen-days"
              ></option>
              <option
                value="30"
                data-l10n-id="nirva-time-travel-thirty-days"
              ></option>
            </select>
          </label>
          <label for="storage-limit">
            <span data-l10n-id="nirva-time-travel-storage-limit"></span>
            <select id="storage-limit">
              <option value="64">64 MB</option>
              <option value="128">128 MB</option>
              <option value="256">256 MB</option>
            </select>
          </label>
          <div class="storage-meter">
            <div class="storage-label">
              <span data-l10n-id="nirva-time-travel-storage-used"></span>
              <output id="storage-value"></output>
            </div>
            <progress id="storage-progress" max="1" value="0"></progress>
          </div>
        </section>
        <p class="privacy-note" data-l10n-id="nirva-time-travel-privacy"></p>
        <div class="settings-actions">
          <button
            id="recording-toggle"
            class="quiet-button"
            type="button"
          ></button>
          <button
            id="clear-all"
            class="quiet-button"
            type="button"
            data-l10n-id="nirva-time-travel-clear"
          ></button>
        </div>
      </details>
    </main>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog" class="confirm-card">
        <p class="eyebrow" data-l10n-id="nirva-time-travel-confirm-label"></p>
        <h2 id="confirm-title"></h2>
        <p id="confirm-copy"></p>
        <div class="confirm-actions">
          <button
            id="confirm-cancel"
            class="quiet-button"
            type="submit"
            value="cancel"
            data-l10n-id="nirva-time-travel-cancel"
          ></button>
          <button
            id="confirm-action"
            class="primary-button"
            type="button"
          ></button>
        </div>
      </form>
    </dialog>
  </body>
</html>
