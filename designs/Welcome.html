<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nirva first launch: choose your look</title>
<!-- Approved Nirva design, 1440 x 900. Reference only: fonts are bundled in the real browser. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&amp;family=Newsreader:wght@300&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#1C1C1A}a:hover{color:#55534E}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 72px 120px 0; background: #F2F1EE; color: #1C1C1A; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 14px">
    <svg width="36" height="36" viewBox="0 0 100 100" role="img" aria-label="Nirva"><rect width="100" height="100" rx="24" fill="#14181D"/><path d="M32 74V26A48 48 0 0 1 68 74V26" fill="none" stroke="#F2F1EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-size: 20px; font-weight: 500; letter-spacing: -.01em">Nirva</span>
  </div>

  <h1 style="margin: 40px 0 0; font-size: 52px; line-height: 1.05; font-weight: 300; letter-spacing: -.025em">Choose your look</h1>
  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #55534E">This becomes your default. You can change it any time in Theme studio.</p>

  <fieldset style="margin: 36px 0 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Look</legend>

    <label style="display: flex; flex-direction: column; gap: 14px; padding: 12px 12px 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 2px #1C1C1A; cursor: pointer">
      <div aria-hidden="true" style="position: relative; height: 232px; border-radius: 10px; overflow: hidden; background: #E8ECEF">
        <div style="position: absolute; left: -70px; bottom: -110px; width: 260px; height: 260px; border-radius: 50%; background: #B4C8DC; filter: blur(30px)"></div>
        <div style="position: absolute; right: -60px; top: -80px; width: 210px; height: 210px; border-radius: 50%; background: #EDD3C4; filter: blur(30px)"></div>
        <div style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: 150px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.8)"></div>
        <div style="position: absolute; left: 28px; top: 48px; font-size: 52px; line-height: 1; font-weight: 200; letter-spacing: -.05em; color: #18212B">10:42</div>
        <div style="position: absolute; left: 28px; right: 28px; bottom: 22px; display: grid; grid-template-columns: 5fr 3fr 4fr; gap: 8px">
          <span style="height: 68px; border-radius: 8px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9)"></span>
          <span style="height: 68px; border-radius: 8px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9)"></span>
          <span style="height: 68px; border-radius: 8px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9)"></span>
        </div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 0 8px">
        <input type="radio" name="look" checked style="width: 18px; height: 18px; margin: 3px 0 0; accent-color: #1C1C1A">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500">Glass</span><span style="font-size: 14px; color: #55534E">Frosted panels over soft light. Bright or dark.</span></div>
      </div>
    </label>

    <label style="display: flex; flex-direction: column; gap: 14px; padding: 12px 12px 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #D8D6D0; cursor: pointer">
      <div aria-hidden="true" style="position: relative; height: 232px; border-radius: 10px; overflow: hidden; background: #0B0E11">
        <div style="position: absolute; left: 28px; right: 28px; top: 24px; height: 1px; background: #1D242C"></div>
        <div style="position: absolute; left: 28px; top: 44px; font-size: 52px; line-height: 1; font-weight: 200; letter-spacing: -.04em; color: #E6EBEF">10:42</div>
        <div style="position: absolute; left: 28px; right: 28px; top: 128px; height: 1px; background: #2A333D"></div>
        <span style="position: absolute; left: 28px; top: 124px; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: #0B0E11; border: 1px solid #93A0AD"></span>
        <span style="position: absolute; left: 124px; top: 124px; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: #0B0E11; border: 1px solid #93A0AD"></span>
        <span style="position: absolute; left: 220px; top: 124px; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: #0B0E11; border: 1px solid #93A0AD"></span>
        <span style="position: absolute; left: 316px; top: 124px; width: 9px; height: 9px; border-radius: 50%; background: #F5B25C"></span>
        <div style="position: absolute; left: 28px; right: 28px; bottom: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <span style="height: 44px; border-top: 1px solid #2A333D; border-bottom: 1px solid #1D242C"></span>
          <span style="height: 44px; border-top: 1px solid #2A333D; border-bottom: 1px solid #1D242C"></span>
          <span style="height: 44px; border-top: 1px solid #2A333D; border-bottom: 1px solid #1D242C"></span>
        </div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 0 8px">
        <input type="radio" name="look" style="width: 18px; height: 18px; margin: 3px 0 0; accent-color: #1C1C1A">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500">Cockpit</span><span style="font-size: 14px; color: #55534E">Thin lines and instrument readouts. Dark only.</span></div>
      </div>
    </label>

    <label style="display: flex; flex-direction: column; gap: 14px; padding: 12px 12px 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #D8D6D0; cursor: pointer">
      <div aria-hidden="true" style="position: relative; height: 232px; border-radius: 10px; overflow: hidden; background: #F5F0E6">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 64px; background: #EDE6D9; border-right: 1px solid #D9D0C0"></div>
        <div style="position: absolute; left: 88px; top: 40px; font-family: Newsreader, serif; font-size: 52px; line-height: 1; font-weight: 300; color: #2A2826">10:42</div>
        <div style="position: absolute; left: 88px; right: 24px; top: 108px; height: 1px; background: #2A2826"></div>
        <div style="position: absolute; left: 88px; right: 24px; bottom: 22px; display: grid; grid-template-columns: 5fr 3fr 4fr; gap: 8px">
          <span style="height: 76px; border-radius: 3px; background: #D5E2D3"></span>
          <span style="height: 76px; border-radius: 3px; background: #D3DFEA"></span>
          <span style="height: 76px; border-radius: 3px; background: #F1E7BE"></span>
        </div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 0 8px">
        <input type="radio" name="look" style="width: 18px; height: 18px; margin: 3px 0 0; accent-color: #1C1C1A">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500">Paper</span><span style="font-size: 14px; color: #55534E">Calm pastels and serif type. Bright or dark.</span></div>
      </div>
    </label>
  </fieldset>

  <div style="margin-top: 36px; display: flex; align-items: center; justify-content: space-between">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; align-items: center; gap: 20px">
      <legend style="float: left; padding: 0; margin-right: 20px; font-size: 14px; color: #55534E">Appearance</legend>
      <div style="display: flex; padding: 4px; border-radius: 26px; background: #E4E2DC">
        <label style="height: 44px; padding: 0 22px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer"><input type="radio" name="mode" style="position: absolute; opacity: 0; width: 1px; height: 1px">Bright</label>
        <label style="height: 44px; padding: 0 22px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer"><input type="radio" name="mode" style="position: absolute; opacity: 0; width: 1px; height: 1px">Dark</label>
        <label style="height: 44px; padding: 0 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(28,28,26,.16); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="mode" checked style="position: absolute; opacity: 0; width: 1px; height: 1px">Match my computer</label>
      </div>
    </fieldset>
    <div style="display: flex; align-items: center; gap: 28px">
      <button style="height: 44px; font-size: 14px; color: #55534E">Import from another browser</button>
      <button style="height: 52px; padding: 0 36px; border-radius: 26px; background: #1C1C1A; color: #F2F1EE; font-size: 15px; font-weight: 500">Continue with Glass</button>
    </div>
  </div>
</div>
</body>
</html>
