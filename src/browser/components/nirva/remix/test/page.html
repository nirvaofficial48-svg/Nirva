<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Harbour weekly</title>
    <style>
      body { margin: 0; padding: 140px 40px 40px; font: 16px/1.2 sans-serif; }
      aside, form, #cookie-consent { width: 420px; padding: 12px; margin: 12px 0; border: 1px solid #999; }
    </style>
  </head>
  <body>
    <aside id="promo">Subscribe now and get forty percent off the weekend edition.</aside>

    <div id="cookie-consent">We use cookies. <button type="button">Accept</button></div>
  </body>
</html>
