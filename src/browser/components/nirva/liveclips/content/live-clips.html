<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="nirva-live-clips-title"></title>
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/nirva/live-clips.ftl" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/tokens.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/fonts.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/theme.css" />
    <link rel="stylesheet" href="chrome://browser/skin/nirva/live-clips.css" />
    <script
      type="module"
      src="chrome://browser/content/nirva/live-clips.mjs"
    ></script>
  </head>
  <body>
    <p
      id="private-notice"
      class="private-notice"
      hidden
      data-l10n-id="nirva-live-clips-private-window"
    ></p>
    <main class="page">
      <header class="page-heading">
        <div class="heading-copy">
          <p class="eyebrow" data-l10n-id="nirva-live-clips-eyebrow"></p>
          <h1 data-l10n-id="nirva-live-clips-title"></h1>
          <p class="intro" data-l10n-id="nirva-live-clips-intro"></p>
        </div>
        <div class="heading-actions">
          <div class="new-clip">
            <button
              id="new-clip"
              class="primary-button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              data-l10n-id="nirva-live-clips-new"
            ></button>
            <div id="new-clip-menu" class="new-clip-menu" hidden>
              <p class="eyebrow" data-l10n-id="nirva-live-clips-new-from"></p>
              <ul id="new-clip-tabs" class="new-clip-tabs"></ul>
              <p
                id="new-clip-none"
                class="muted"
                hidden
                data-l10n-id="nirva-live-clips-new-none"
              ></p>
            </div>
          </div>
          <button
            id="refresh-all"
            class="quiet-button"
            type="button"
            data-l10n-id="nirva-live-clips-refresh-all"
          ></button>
          <button
            id="pause-all"
            class="quiet-button"
            type="button"
            data-l10n-id="nirva-live-clips-pause-all"
          ></button>
        </div>
      </header>

      <section class="clip-section" aria-labelledby="clips-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-l10n-id="nirva-live-clips-list-label"></p>
            <h2
              id="clips-heading"
              data-l10n-id="nirva-live-clips-list-title"
            ></h2>
          </div>
          <p id="clip-count" class="clip-count"></p>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="empty-state" class="empty-state" hidden>
          <h3 data-l10n-id="nirva-live-clips-empty-title"></h3>
          <p data-l10n-id="nirva-live-clips-empty-copy"></p>
        </div>
        <ol id="clips" class="clip-list" aria-labelledby="clips-heading"></ol>
      </section>

      <section class="privacy-note" aria-labelledby="privacy-heading">
        <h2
          id="privacy-heading"
          data-l10n-id="nirva-live-clips-privacy-title"
        ></h2>
        <p data-l10n-id="nirva-live-clips-privacy-copy"></p>
      </section>
    </main>
    <template id="clip-template">
      <li class="clip-card">
        <div class="clip-heading">
          <div class="clip-copy">
            <h3 class="clip-title"></h3>
            <p class="clip-source"></p>
          </div>
          <button
            class="clip-changed"
            type="button"
            hidden
            data-l10n-id="nirva-live-clips-changed"
          ></button>
        </div>
        <p class="clip-text"></p>
        <details class="clip-previous" hidden>
          <summary data-l10n-id="nirva-live-clips-previous"></summary>
          <p class="clip-previous-text"></p>
        </details>
        <p class="clip-error" hidden></p>
        <form class="clip-editor" hidden>
          <label>
            <span data-l10n-id="nirva-live-clips-edit-title-label"></span>
            <input class="edit-title" maxlength="100" required />
          </label>
          <label>
            <span data-l10n-id="nirva-live-clips-edit-selector-label"></span>
            <input class="edit-selector" maxlength="2048" required />
          </label>
          <div class="editor-actions">
            <button
              class="save-edit primary-button"
              type="submit"
              data-l10n-id="nirva-live-clips-save"
            ></button>
            <button
              class="cancel-edit quiet-button"
              type="button"
              data-l10n-id="nirva-live-clips-cancel"
            ></button>
          </div>
        </form>
        <div class="clip-foot">
          <p class="clip-updated"></p>
          <div class="clip-actions">
            <button
              class="refresh-clip quiet-button"
              type="button"
              data-l10n-id="nirva-live-clips-refresh"
            ></button>
            <button
              class="open-source quiet-button"
              type="button"
              data-l10n-id="nirva-live-clips-open-source"
            ></button>
          </div>
        </div>
        <details class="clip-more">
          <summary>
            <span data-l10n-id="nirva-live-clips-more"></span>
            <span class="clip-schedule-state"></span>
          </summary>
          <div class="clip-more-panel">
            <label class="schedule-label">
              <span data-l10n-id="nirva-live-clips-schedule-label"></span>
              <select class="clip-schedule">
                <option
                  value="0"
                  data-l10n-id="nirva-live-clips-manual"
                ></option>
                <option
                  value="6"
                  data-l10n-id="nirva-live-clips-six-hours"
                ></option>
                <option
                  value="24"
                  data-l10n-id="nirva-live-clips-daily"
                ></option>
              </select>
            </label>
            <div class="clip-more-actions">
              <button class="pause-clip quiet-button" type="button"></button>
              <button
                class="edit-clip quiet-button"
                type="button"
                data-l10n-id="nirva-live-clips-edit"
              ></button>
              <button
                class="remove-clip danger-button"
                type="button"
                data-l10n-id="nirva-live-clips-remove"
              ></button>
            </div>
          </div>
        </details>
      </li>
    </template>
  </body>
</html>
