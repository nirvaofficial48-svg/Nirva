# Full builds of the fork on GitHub's free standard runners.
# Started by hand: Actions tab -> "Build" -> "Run workflow".
name: Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which systems to build: all, linux, macos or windows"
        default: all

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    if: inputs.targets == 'all' || inputs.targets == matrix.name
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-15 }
          - { name: windows, os: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install MozillaBuild
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process .\mb.exe -ArgumentList '/S' -Wait

      - name: Fetch Firefox at the base commit
        run: |
          base=$(cut -d' ' -f1 firefox-base.txt)
          git init -q firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox
          git -C firefox fetch -q --depth 1 origin "$base"
          git -C firefox checkout -q FETCH_HEAD

      - name: Apply Nirva changes
        run: |
          cp configs/mozconfig.release firefox/mozconfig
          python3 tools/nirva-patches import

      - name: Bootstrap
        working-directory: firefox
        run: ./mach --no-interactive bootstrap --application-choice browser

      - name: Build
        working-directory: firefox
        run: ./mach build

      - name: Package
        working-directory: firefox
        run: ./mach package

      - uses: actions/upload-artifact@v4
        with:
          name: nirva-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            firefox/obj-nirva/dist/*.tar.xz
            firefox/obj-nirva/dist/*.dmg
            firefox/obj-nirva/dist/*.zip
            firefox/obj-nirva/dist/install/sea/*.exe
